<mat-toolbar class="toolbar">
  <mat-icon>menu_book</mat-icon>
  <span>Library Management System</span>

  <span class="spacer"></span>

  <!-- Knihy -->
  <a mat-icon-button
     routerLink="/books"
     routerLinkActive="active"
     aria-label="Knihy"
     title="Knihy">
    <mat-icon>library_books</mat-icon>
  </a>

  <!-- Košík -->
  <a mat-icon-button
     routerLink="/cart"
     routerLinkActive="active"
     aria-label="Košík"
     title="Košík">
    <mat-icon
      [matBadge]="borrowedBooks().length"
      [matBadgeHidden]="borrowedBooks().length === 0"
      matBadgeDescription="Počet požičaných kníh">
      shopping_cart
    </mat-icon>
  </a>

  <a mat-icon-button
   routerLink="/admin"
   routerLinkActive="active"
   aria-label="Administrácia"
   title="Administrácia">
  <mat-icon>admin_panel_settings</mat-icon>
</a>
</mat-toolbar>

<main>
  <router-outlet />
</main>
