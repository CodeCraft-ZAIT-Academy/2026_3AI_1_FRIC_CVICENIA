@if (loading()) {
  <p role="status">Načítavam knihy…</p>
} @else if (loadError()) {
  <p role="alert">{{ loadError() }}</p>
} @else if (id() === undefined) {
  <h1>Nová kniha</h1>

  <app-book-form
    (saved)="save($event)"
    (cancelled)="cancel()">
  </app-book-form>
} @else if (book(); as currentBook) {
  <h1>Úprava knihy</h1>

  <app-book-form
    [book]="currentBook"
    (saved)="save($event)"
    (cancelled)="cancel()">
  </app-book-form>
} @else {
  <p class="empty">Kniha s číslom {{ id() }} v knižnici neexistuje.</p>
  <button matButton="filled" routerLink="/admin">
    Späť na administráciu
  </button>
}
